    <script>
        const viewport = document.querySelector('.genex-viewport');
        let isDown = false;
        let startX, startY, scrollLeft, scrollTop;
        viewport.addEventListener('mousedown', (e) => { isDown = true; startX = e.pageX - viewport.offsetLeft; startY = e.pageY - viewport.offsetTop; scrollLeft = viewport.scrollLeft; scrollTop = viewport.scrollTop; });
        viewport.addEventListener('mouseleave', () => { isDown = false; });
        viewport.addEventListener('mouseup', () => { isDown = false; });
        viewport.addEventListener('mousemove', (e) => { if (!isDown) return; e.preventDefault(); viewport.scrollLeft = scrollLeft - (e.pageX - viewport.offsetLeft - startX); viewport.scrollTop = scrollTop - (e.pageY - viewport.offsetTop - startY); });
        document.querySelector('.genex-viewport').addEventListener('contextmenu', e => e.preventDefault());
    </script>
